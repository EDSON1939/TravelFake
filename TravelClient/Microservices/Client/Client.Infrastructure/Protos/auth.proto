syntax = "proto3";
// Copia del contrato publicado por el microservicio Auth
// (TravelFake\Microservices\Auth\Auth.Api\Protos\auth.proto).
// Se compila con GrpcServices="Client": aquí solo se genera el consumidor.
option csharp_namespace = "Client.Infrastructure.Grpc";
package auth;

import "base_response.proto";

// ─── Servicio ────────────────────────────────────────────────────────────────
// Único emisor de JWT del sistema. Este microservicio solo usa CreateUser, para
// darle acceso al cliente en el momento de registrarlo.
service Auth {
    rpc Login      (LoginRequestPb)      returns (LoginBaseResponsePb);
    rpc CreateUser (CreateUserRequestPb) returns (UserMutationBaseResponsePb);
    rpc DeleteUser (DeleteUserRequestPb) returns (UserMutationBaseResponsePb);
}

// ─── Requests ────────────────────────────────────────────────────────────────
message LoginRequestPb {
    string username = 1;
    string password = 2;
}

message CreateUserRequestPb {
    string username  = 1;
    string password  = 2;
    // Documento del cliente del negocio. Vacio solo para ADMIN interno.
    string document  = 3;
    string full_name = 4;
    string role      = 5;  // CLIENTE | AGENTE | ADMIN
}

message DeleteUserRequestPb {
    int64 user_id = 1;
}

// ─── Data ────────────────────────────────────────────────────────────────────
message LoginDataPb {
    string access_token = 1;
    string expires_at   = 2;
    int32  expires_in   = 3;  // segundos
    int64  user_id      = 4;
    int64  client_id    = 5;  // 0 si no tiene cliente asociado
    string username     = 6;
    string full_name    = 7;
    string role         = 8;
}

// ─── Responses ───────────────────────────────────────────────────────────────
message LoginBaseResponsePb {
    string                          message     = 1;
    LoginDataPb                     data        = 2;
    repeated base_response.ErrorPb  errors      = 3;
    base_response.ExceptionDetailPb exception   = 4;
    string                          status_code = 5;
}

message UserMutationBaseResponsePb {
    string                          message     = 1;
    int64                           data        = 2;
    repeated base_response.ErrorPb  errors      = 3;
    base_response.ExceptionDetailPb exception   = 4;
    string                          status_code = 5;
}
