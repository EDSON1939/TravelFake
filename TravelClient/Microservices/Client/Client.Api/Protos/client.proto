syntax = "proto3";
option csharp_namespace = "Client.Api.Grpc";
package client;

import "base_response.proto";

// ─── Servicio ────────────────────────────────────────────────────────────────
service Client {
    rpc GetClient          (GetClientRequestPb)          returns (GetClientBaseResponsePb);
    rpc GetClients         (GetClientsRequestPb)         returns (GetClientsBaseResponsePb);
    rpc CreateClient       (CreateClientRequestPb)       returns (ClientMutationBaseResponsePb);
    rpc UpdateClient       (UpdateClientRequestPb)       returns (ClientMutationBaseResponsePb);
    rpc UpdateClientStatus (UpdateClientStatusRequestPb) returns (ClientMutationBaseResponsePb);
    rpc DeleteClient       (DeleteClientRequestPb)       returns (ClientMutationBaseResponsePb);

    // Catálogo servido por el microservicio TravelCountry (para poblar el selector de país)
    rpc GetCountries       (GetCountriesRequestPb)       returns (GetCountriesBaseResponsePb);
}

// ─── Requests ────────────────────────────────────────────────────────────────
message GetClientRequestPb {
    int64 customer_id = 1;
}

message GetClientsRequestPb {
    bool  only_active = 1;
    int64 country_id  = 2;  // 0 = todos los países
}

message CreateClientRequestPb {
    string first_name = 1;
    string last_name  = 2;
    string email      = 3;
    string phone      = 4;
    int64  country_id = 5;
}

message UpdateClientRequestPb {
    int64  customer_id = 1;
    string first_name  = 2;
    string last_name   = 3;
    string email       = 4;
    string phone       = 5;
    int64  country_id  = 6;
    bool   is_active   = 7;
}

message UpdateClientStatusRequestPb {
    int64 customer_id = 1;
    bool  is_active   = 2;
}

message GetCountriesRequestPb {
    bool only_active = 1;
}

message DeleteClientRequestPb {
    int64 customer_id = 1;
}

// ─── Data ────────────────────────────────────────────────────────────────────
message ClientDataPb {
    int64  customer_id  = 1;
    string first_name   = 2;
    string last_name    = 3;
    string email        = 4;
    string phone        = 5;
    int64  country_id   = 6;
    string country_name = 7;
    string country_code = 8;
    bool   is_active    = 9;
    string created_at   = 10;
    string updated_at   = 11;
}

// ─── Responses ───────────────────────────────────────────────────────────────
message GetClientBaseResponsePb {
    string                          message     = 1;
    ClientDataPb                    data        = 2;
    repeated base_response.ErrorPb  errors      = 3;
    base_response.ExceptionDetailPb exception   = 4;
    string                          status_code = 5;
}

message GetClientsBaseResponsePb {
    string                          message     = 1;
    repeated ClientDataPb           data        = 2;
    repeated base_response.ErrorPb  errors      = 3;
    base_response.ExceptionDetailPb exception   = 4;
    string                          status_code = 5;
}

message ClientMutationBaseResponsePb {
    string                          message     = 1;
    int64                           data        = 2;
    repeated base_response.ErrorPb  errors      = 3;
    base_response.ExceptionDetailPb exception   = 4;
    string                          status_code = 5;
}

// ─── País (proxy hacia TravelCountry) ────────────────────────────────────────
message CountryDataPb {
    int64  country_id = 1;
    string name       = 2;
    string code       = 3;
    bool   is_active  = 4;
}

message GetCountriesBaseResponsePb {
    string                          message     = 1;
    repeated CountryDataPb          data        = 2;
    repeated base_response.ErrorPb  errors      = 3;
    base_response.ExceptionDetailPb exception   = 4;
    string                          status_code = 5;
}
